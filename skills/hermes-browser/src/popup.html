<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hermes Browser</title>
  <style>
    body {
      font: 13px/1.5 -apple-system, sans-serif;
      width: 280px;
      padding: 12px;
      margin: 0;
      background: #1a1c20;
      color: #e6e6e6;
    }
    h2 { font-size: 14px; margin: 0 0 8px; color: #d97706; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2d33;
    }
    .row:last-child { border-bottom: none; }
    .label { color: #8a8d93; }
    button {
      padding: 6px 10px;
      background: #d97706;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #f59e0b; }
    button.secondary { background: #2a2d33; }
    button.danger { background: #7f1d1d; }
    .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status.ok { background: #10b981; }
    .status.no { background: #ef4444; }
    .note { font-size: 11px; color: #6b6d73; margin-top: 8px; padding: 6px; background: #15171b; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>🔥 Hermes Browser Control</h2>

  <div class="row">
    <span class="label">Status</span>
    <span><span class="status" id="status"></span><span id="statusText">checking</span></span>
  </div>

  <div class="row">
    <span class="label">Extension</span>
    <span id="version">—</span>
  </div>

  <div class="row">
    <button id="installBtn" class="secondary">📦 Install Native Host</button>
  </div>
  <div class="row">
    <button id="openSideBtn">📂 Open Side Panel</button>
  </div>
  <div class="row">
    <button id="uninstallBtn" class="danger">🗑️ Uninstall</button>
  </div>

  <div class="note">
    ⚠️ Native host not yet available in Phase 1.
    <br>Phase 2 will add install/uninstall + auto-detect.
  </div>

  <script src="popup.js"></script>
</body>
</html>
